baseURL: 'https://yusanwen-code.github.io'
locale: 'zh-CN'
title: '姚玉亮的网络日志'
theme: 'hugo-theme-stack'

# 分页设置
paginate: 10

# 保留文章 URL 结构（/posts/:slug/），避免旧链接失效
permalinks:
  post: /posts/:slug/

# 启用 RSS
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

# 菜单配置（v4: 社交链接用 menu.social，图标取 assets/icons/ 下的名字）
menu:
  main:
    - identifier: home
      name: 首页
      url: /
      weight: 1
    - identifier: archives
      name: 归档
      url: /page/archives/
      weight: 2
    - identifier: about
      name: 关于
      url: /page/about/
      weight: 3
  social:
    - identifier: github
      name: GitHub
      url: 'https://github.com/yusanwen-code'
      params:
        icon: brand-github
        newTab: true
    - identifier: email
      name: Email
      url: 'mailto:yaodawang6@foxmail.com'
      params:
        icon: link
        newTab: true
    - identifier: rss
      name: RSS
      url: 'index.xml'
      params:
        icon: rss
        newTab: true

# Stack 主题参数
params:
  # 首页展示的文章目录
  mainSections:
    - post
  description: '一个记录技术、思考与创造的后端博客'
  author: yaoyuliang

  # 侧边栏（v4: avatar 是 URL 字符串，不配置则用 emoji 头像）
  sidebar:
    emoji: ⚙️
    subtitle: AI 全栈
    compact: false

  # 页脚
  footer:
    since: 2023
    copyright: 保持好奇，持续学习。

  # 文章页设置
  article:
    toc: true
    readingTime: true
    math: false
    license:
      enabled: false

  # 站内搜索
  search:
    enabled: true

  # 首页右侧小组件（Stack v4: key 为 homepage / page，参数放元素级 params）
  widgets:
    homepage:
      - type: search
      - type: categories
      - type: tag-cloud
      - type: archives
        params:
          limit: 10
    page:
      - type: toc

# 标记语言设置
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: github-dark
    lineNos: true
    codeFences: true
    guessSyntax: true
    noClasses: true
