<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="1" y="1" width="878" height="538" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="44" y="50" font-size="20" font-weight="700" fill="#1e293b">炼丹炉整体链路：金丹进炉，炼出新分身</text>
  <text x="44" y="74" font-size="13" fill="#64748b">Go 网关管任务与账本，Python 丹炉做合成，产物可复现、可追溯</text>

  <defs>
    <marker id="arwC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
  </defs>

  <rect x="60" y="108" width="170" height="58" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="145" y="131" text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1">金丹 A · 学术写作</text>
  <text x="145" y="150" text-anchor="middle" font-size="11" fill="#64748b">结构化技能包 v3</text>

  <rect x="60" y="178" width="170" height="58" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="145" y="201" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">金丹 B · Go 后端</text>
  <text x="145" y="220" text-anchor="middle" font-size="11" fill="#64748b">结构化技能包 v1</text>

  <rect x="60" y="248" width="170" height="58" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="145" y="271" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">金丹 C · 毒舌点评</text>
  <text x="145" y="290" text-anchor="middle" font-size="11" fill="#64748b">结构化技能包 v1</text>

  <line x1="230" y1="137" x2="296" y2="175" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>
  <line x1="230" y1="207" x2="296" y2="215" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>
  <line x1="230" y1="277" x2="296" y2="255" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="300" y="140" width="190" height="150" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="395" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">丹炉 · 融合引擎</text>
  <text x="318" y="196" font-size="12" fill="#1e293b">crossover 交叉</text>
  <text x="318" y="218" font-size="12" fill="#1e293b">mutate 变异</text>
  <text x="318" y="240" font-size="12" fill="#1e293b">ensemble 集成</text>
  <text x="318" y="268" font-size="11" fill="#92400e">融合前先做冲突检测</text>

  <line x1="490" y1="215" x2="556" y2="190" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arwC)"/>
  <text x="523" y="196" text-anchor="middle" font-size="11" fill="#94a3b8">调 LLM 合成</text>

  <rect x="560" y="130" width="250" height="110" rx="10" fill="#059669"/>
  <text x="685" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">新分身 Agent</text>
  <text x="685" y="182" text-anchor="middle" font-size="11" fill="#d1fae5">合成 system prompt + 工具白名单</text>
  <text x="685" y="202" text-anchor="middle" font-size="11" fill="#d1fae5">OpenAI 兼容协议对外服务</text>
  <text x="685" y="222" text-anchor="middle" font-size="11" fill="#d1fae5">满意后可固化为新金丹</text>

  <line x1="685" y1="240" x2="685" y2="300" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>
  <text x="700" y="274" font-size="11" fill="#94a3b8">任务完成时统一构建</text>

  <rect x="300" y="304" width="510" height="88" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="324" y="330" font-size="13" font-weight="700" fill="#475569">血统账本 lineage</text>
  <text x="324" y="354" font-size="12" fill="#64748b">parent_elixir_ids · mutation_operators · 全部合成参数</text>
  <text x="324" y="376" font-size="12" fill="#64748b">lineage_hash = sha256(parents · 算子 · 参数)</text>

  <rect x="60" y="416" width="380" height="64" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="84" y="440" font-size="13" font-weight="700" fill="#0369a1">Go 网关包在最外层</text>
  <text x="84" y="460" font-size="12" fill="#64748b">鉴权 · 配额 · 提交融合任务（202 + job_id）</text>
  <text x="84" y="478" font-size="12" fill="#64748b">SSE 推送进度；丹炉不可用时降级</text>

  <rect x="460" y="416" width="360" height="64" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="484" y="440" font-size="13" font-weight="700" fill="#b45309">关键元指令 FURNACE_META_PROMPT</text>
  <text x="484" y="460" font-size="12" fill="#64748b">「你在融合人格特质，不是在扮演谁」</text>
  <text x="484" y="478" font-size="12" fill="#64748b">第三人称合成，比直接演混合体稳定</text>

  <text x="44" y="514" font-size="12" fill="#94a3b8">血统全程落库：任何合成人格都能回溯祖先，同参数重跑可复现</text>
</svg>
