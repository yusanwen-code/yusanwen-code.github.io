<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="1" y="1" width="878" height="498" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="44" y="50" font-size="20" font-weight="700" fill="#1e293b">三端分离，一个支付内核</text>
  <text x="44" y="74" font-size="13" fill="#64748b">接入层管认证和展示，核心层管状态机和渠道</text>

  <defs>
    <marker id="arwC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
  </defs>

  <rect x="60" y="110" width="240" height="90" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="180" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">用户端</text>
  <text x="180" y="160" text-anchor="middle" font-size="12" fill="#475569">OAuth2 登录 · 普通用户权限</text>
  <text x="180" y="182" text-anchor="middle" font-size="12" fill="#64748b">下单 · 查单 · 回调接收</text>

  <rect x="320" y="110" width="240" height="90" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="440" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">商户端</text>
  <text x="440" y="160" text-anchor="middle" font-size="12" fill="#475569">AppID 签名认证 + 防重放</text>
  <text x="440" y="182" text-anchor="middle" font-size="12" fill="#64748b">统一下单 · 退款 · 查询</text>

  <rect x="580" y="110" width="240" height="90" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="700" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">管理端</text>
  <text x="700" y="160" text-anchor="middle" font-size="12" fill="#475569">RBAC 权限</text>
  <text x="700" y="182" text-anchor="middle" font-size="12" fill="#64748b">审批 · 调账 · 对账导出</text>

  <line x1="180" y1="200" x2="180" y2="240" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arwC)"/>
  <line x1="440" y1="200" x2="440" y2="240" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arwC)"/>
  <line x1="700" y1="200" x2="700" y2="240" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arwC)"/>
  <text x="452" y="226" font-size="11" fill="#94a3b8">gRPC · 各端自行组装 DTO</text>

  <rect x="60" y="244" width="760" height="96" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="84" y="272" font-size="14" font-weight="700" fill="#047857">payment-core 统一支付内核</text>
  <rect x="84" y="288" width="170" height="34" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1"/>
  <text x="169" y="310" text-anchor="middle" font-size="12" fill="#047857">订单状态机</text>
  <rect x="274" y="288" width="170" height="34" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1"/>
  <text x="359" y="310" text-anchor="middle" font-size="12" fill="#047857">计费引擎 Rule 接口</text>
  <rect x="464" y="288" width="180" height="34" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1"/>
  <text x="554" y="310" text-anchor="middle" font-size="12" fill="#047857">渠道适配 Channel 接口</text>
  <rect x="664" y="288" width="132" height="34" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1"/>
  <text x="730" y="310" text-anchor="middle" font-size="12" fill="#047857">对账内核</text>

  <line x1="180" y1="340" x2="180" y2="384" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arwC)"/>
  <line x1="440" y1="340" x2="440" y2="384" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arwC)"/>
  <line x1="700" y1="340" x2="700" y2="384" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arwC)"/>

  <rect x="60" y="388" width="240" height="60" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="180" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">支付渠道 A</text>
  <text x="180" y="432" text-anchor="middle" font-size="12" fill="#64748b">下单 · 查单 · 退款 · 回调解析</text>

  <rect x="320" y="388" width="240" height="60" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="440" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">支付渠道 B</text>
  <text x="440" y="432" text-anchor="middle" font-size="12" fill="#64748b">同一个 Channel 接口</text>

  <rect x="580" y="388" width="240" height="60" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="700" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">渠道 N · 可插拔</text>
  <text x="700" y="432" text-anchor="middle" font-size="12" fill="#64748b">新增渠道只加适配器</text>

  <text x="44" y="478" font-size="12" fill="#94a3b8">回调幂等：order_no + channel_trade_no 唯一索引 · 导出流式写，几十万行不 OOM · 数据隔离按 merchant_id 强制过滤</text>
</svg>
