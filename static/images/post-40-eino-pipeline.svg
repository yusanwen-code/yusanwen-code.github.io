<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="1" y="1" width="878" height="518" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="44" y="50" font-size="20" font-weight="700" fill="#1e293b">外层 pond 池 + 内层 eino DAG：两层并发</text>
  <text x="44" y="74" font-size="13" fill="#64748b">文档级并发交给 pond，文档内的页级并行交给 Graph 扇出</text>

  <defs>
    <marker id="arwC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
    <marker id="arwG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect x="44" y="104" width="180" height="64" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="134" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">批量上传文档</text>
  <text x="134" y="148" text-anchor="middle" font-size="11" fill="#64748b">PDF · Word · 图片</text>

  <line x1="224" y1="136" x2="260" y2="136" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="264" y="104" width="230" height="64" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="379" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#0369a1">pond goroutine 池</text>
  <text x="379" y="148" text-anchor="middle" font-size="11" fill="#1e293b">控制文档级并发</text>

  <line x1="379" y1="168" x2="379" y2="228" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>
  <text x="387" y="202" font-size="11" fill="#64748b">每份文档一条 Chain</text>

  <rect x="44" y="232" width="792" height="250" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="254" font-size="12" fill="#64748b">eino Chain / Graph（单份文档）</text>

  <rect x="60" y="272" width="88" height="72" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="104" y="308" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">下载</text>

  <line x1="148" y1="308" x2="164" y2="308" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="168" y="272" width="96" height="72" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="216" y="308" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">格式检测</text>

  <line x1="264" y1="308" x2="280" y2="308" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="284" y="272" width="110" height="72" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="339" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">解析抽取</text>
  <text x="339" y="320" text-anchor="middle" font-size="11" fill="#64748b">页级扇出</text>

  <line x1="394" y1="308" x2="410" y2="308" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="414" y="272" width="96" height="72" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="462" y="308" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">清洗分块</text>

  <line x1="510" y1="308" x2="526" y2="308" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="530" y="272" width="110" height="72" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="585" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1">向量化</text>
  <text x="585" y="320" text-anchor="middle" font-size="11" fill="#1e293b">micro-batch 16 条</text>

  <line x1="640" y1="308" x2="656" y2="308" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="660" y="272" width="120" height="72" rx="10" fill="#059669"/>
  <text x="720" y="304" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">入向量库</text>
  <text x="720" y="324" text-anchor="middle" font-size="11" fill="#d1fae5">失败即整份失败</text>

  <line x1="339" y1="344" x2="215" y2="412" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>
  <line x1="339" y1="344" x2="365" y2="412" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>
  <line x1="339" y1="344" x2="510" y2="412" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="150" y="416" width="130" height="52" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="215" y="446" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">第 1 页 · OCR</text>

  <rect x="300" y="416" width="130" height="52" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="365" y="446" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">第 2 页 · 版面识别</text>

  <rect x="450" y="416" width="120" height="52" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="510" y="446" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">第 N 页 · OCR</text>

  <line x1="280" y1="442" x2="616" y2="432" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>
  <line x1="430" y1="442" x2="616" y2="442" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>
  <line x1="570" y1="442" x2="616" y2="452" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="620" y="416" width="130" height="52" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="685" y="440" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">聚合</text>
  <text x="685" y="458" text-anchor="middle" font-size="11" fill="#64748b">成功页继续</text>

  <path d="M750,416 L750,378 L462,378 L462,348" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arwC)"/>

  <text x="44" y="506" font-size="12" fill="#94a3b8">组件无状态可并发复用 · callback 打点串成 Jaeger trace · 失败页跳过，关键阶段失败才整份失败</text>
</svg>
