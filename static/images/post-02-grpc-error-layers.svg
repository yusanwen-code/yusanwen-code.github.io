<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="1" y="1" width="878" height="468" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="44" y="50" font-size="20" font-weight="700" fill="#1e293b">gRPC 错误分两层走</text>
  <text x="44" y="74" font-size="13" fill="#64748b">RPC 层错误走 status，业务错误走 BaseResp.code</text>

  <defs>
    <marker id="arwC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
  </defs>

  <rect x="360" y="104" width="180" height="52" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="450" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">调用方（挂号服务）</text>
  <line x1="450" y1="156" x2="450" y2="192" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arwC)"/>
  <text x="462" y="178" font-size="11" fill="#94a3b8">gRPC 调用</text>

  <rect x="350" y="196" width="200" height="52" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="450" y="226" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">服务提供方（收费服务）</text>

  <line x1="446" y1="248" x2="210" y2="292" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>
  <line x1="454" y1="248" x2="670" y2="292" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="100" y="296" width="220" height="100" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="116" y="322" font-size="13" font-weight="700" fill="#dc2626">RPC 层错误</text>
  <text x="116" y="344" font-size="12" fill="#1e293b">走 gRPC status</text>
  <text x="116" y="362" font-size="12" fill="#64748b">超时 · 服务不可用</text>
  <text x="116" y="380" font-size="12" fill="#64748b">客户端拦截器统一记日志</text>

  <rect x="560" y="296" width="220" height="100" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="576" y="322" font-size="13" font-weight="700" fill="#0369a1">业务错误</text>
  <text x="576" y="344" font-size="12" fill="#1e293b">放 BaseResp.code</text>
  <text x="576" y="362" font-size="12" fill="#64748b">宠物已建档 · 号源已满</text>
  <text x="576" y="380" font-size="12" fill="#64748b">ToBaseResp(err) 统一映射</text>

  <text x="44" y="428" font-size="12" fill="#94a3b8">上游只判断 err 是否为 nil，BaseResp 的解包沉到 logic 层</text>
  <text x="44" y="448" font-size="12" fill="#94a3b8">另一条纪律：大载荷只传 S3 预签名 URL，消息体控制在几十 KB</text>
</svg>
