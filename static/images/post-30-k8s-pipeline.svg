<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="1" y="1" width="878" height="418" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="44" y="50" font-size="20" font-weight="700" fill="#1e293b">KubeSphere 发布流水线：从合并代码到滚动更新</text>
  <text x="44" y="74" font-size="13" fill="#64748b">回滚不靠手速：上一个 ReplicaSet 一直保留，一条命令退回去</text>

  <defs>
    <marker id="arwC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
    <marker id="arwR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="34" y="108" width="120" height="90" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="94" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">代码合并主分支</text>
  <text x="94" y="162" text-anchor="middle" font-size="11" fill="#64748b">GitLab</text>

  <line x1="154" y1="153" x2="170" y2="153" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="174" y="108" width="160" height="90" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="254" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#0369a1">CI 构建</text>
  <text x="254" y="154" text-anchor="middle" font-size="11" fill="#1e293b">多阶段 Dockerfile</text>
  <text x="254" y="172" text-anchor="middle" font-size="11" fill="#1e293b">600MB → 20MB</text>
  <text x="254" y="190" text-anchor="middle" font-size="11" fill="#64748b">tag = commit sha</text>

  <line x1="334" y1="153" x2="350" y2="153" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="354" y="108" width="130" height="90" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="419" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">私有镜像仓库</text>
  <text x="419" y="162" text-anchor="middle" font-size="11" fill="#64748b">CI 推送新镜像</text>

  <line x1="484" y1="153" x2="500" y2="153" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="504" y="108" width="180" height="90" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="594" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">Deployment 滚动更新</text>
  <text x="594" y="152" text-anchor="middle" font-size="11" fill="#1e293b">maxSurge=1 · maxUnavailable=0</text>
  <text x="594" y="170" text-anchor="middle" font-size="11" fill="#1e293b">探针未就绪不接流量</text>
  <text x="594" y="188" text-anchor="middle" font-size="11" fill="#64748b">KubeSphere 控制台可视</text>

  <line x1="684" y1="153" x2="700" y2="153" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="704" y="108" width="142" height="90" rx="10" fill="#059669"/>
  <text x="775" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">对外服务</text>
  <text x="775" y="162" text-anchor="middle" font-size="11" fill="#d1fae5">Istio 按比例灰度</text>
  <text x="775" y="180" text-anchor="middle" font-size="11" fill="#d1fae5">服务不中断</text>

  <line x1="570" y1="198" x2="600" y2="252" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arwR)"/>
  <text x="556" y="230" font-size="11" fill="#dc2626">发布异常</text>

  <rect x="44" y="256" width="380" height="86" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="68" y="282" font-size="13" font-weight="700" fill="#b45309">配置与密钥分离</text>
  <text x="68" y="304" font-size="11" fill="#1e293b">ConfigMap + Secret，env 或 Volume 挂载</text>
  <text x="68" y="322" font-size="11" fill="#64748b">配置变更不重打镜像，密钥不进代码仓库</text>

  <rect x="456" y="256" width="380" height="86" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="480" y="282" font-size="13" font-weight="700" fill="#dc2626">回滚</text>
  <text x="480" y="304" font-size="11" fill="#1e293b">kubectl rollout undo 一条命令，控制台也能一键</text>
  <text x="480" y="322" font-size="11" fill="#64748b">退回上一个 ReplicaSet，5 分钟内回到稳定版本</text>

  <text x="44" y="392" font-size="12" fill="#94a3b8">灰度基于 Istio 金丝雀：Sidecar 注入约增加 20ms 延迟，延迟敏感的服务接入前先掂量</text>
</svg>
