<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="1" y="1" width="878" height="498" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="44" y="50" font-size="20" font-weight="700" fill="#1e293b">Prompt 当代码管：模板树 · 版本引用 · 评测守护</text>
  <text x="44" y="74" font-size="13" fill="#64748b">公共片段可组合，线上引用带版本号，改动和代码一样过 CI</text>

  <defs>
    <marker id="arwC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
    <marker id="arwG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect x="60" y="110" width="270" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="76" y="136" font-size="13" font-weight="700" fill="#1e293b">prompts/ 模板树</text>
  <text x="76" y="162" font-size="12" fill="#1e293b">shared/：safety · format_json · role</text>
  <text x="76" y="184" font-size="12" fill="#1e293b">rag/：answer_v2 · answer_v3 · rerank</text>
  <text x="76" y="206" font-size="12" fill="#1e293b">extract/：entity_v1</text>
  <text x="76" y="236" font-size="11" fill="#64748b">业务模板只写任务，公共片段可组合</text>

  <line x1="330" y1="185" x2="356" y2="185" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="360" y="110" width="210" height="150" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="376" y="136" font-size="13" font-weight="700" fill="#0369a1">Registry</text>
  <text x="376" y="162" font-size="12" fill="#1e293b">整个目录编译进内存</text>
  <text y="184" font-size="12" fill="#1e293b" x="376">key = name:version</text>
  <text x="376" y="210" font-size="11" fill="#64748b">开发环境支持热加载</text>

  <line x1="570" y1="185" x2="596" y2="185" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="600" y="110" width="240" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="616" y="136" font-size="13" font-weight="700" fill="#1e293b">业务调用</text>
  <text x="616" y="162" font-size="12" fill="#1e293b">Render("rag/answer", "v3")</text>
  <text x="616" y="186" font-size="12" fill="#1e293b">显式指定版本号</text>
  <text x="616" y="210" font-size="11" fill="#64748b">不读环境变量，不用 latest</text>

  <text x="60" y="298" font-size="12" fill="#94a3b8">改 Prompt 的路径</text>

  <rect x="60" y="312" width="230" height="96" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="76" y="338" font-size="13" font-weight="700" fill="#b45309">改动走 PR</text>
  <text x="76" y="362" font-size="12" fill="#1e293b">.tmpl 是独立文件，不淹在 diff 里</text>
  <text x="76" y="384" font-size="11" fill="#64748b">产品和领域专家也能评审</text>

  <line x1="290" y1="360" x2="316" y2="360" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="320" y="312" width="240" height="96" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="336" y="338" font-size="13" font-weight="700" fill="#059669">评测集把关</text>
  <text x="336" y="362" font-size="12" fill="#1e293b">单测断言行为，不逐字比对</text>
  <text x="336" y="384" font-size="11" fill="#475569">CI 跑 300 条，指标对比基线</text>

  <line x1="560" y1="360" x2="586" y2="360" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="590" y="312" width="250" height="96" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="606" y="338" font-size="13" font-weight="700" fill="#6d28d9">版本只增不改</text>
  <text x="606" y="362" font-size="12" fill="#1e293b">v2→v3 新建文件，不覆盖</text>
  <text x="606" y="384" font-size="11" fill="#64748b">老版本永久保留，A/B 有据可查</text>

  <line x1="690" y1="312" x2="540" y2="262" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arwC)"/>
  <text x="640" y="282" text-anchor="middle" font-size="11" fill="#94a3b8">新版本入库</text>

  <text x="44" y="470" font-size="12" fill="#94a3b8">few-shot 示例抽到独立 YAML，按场景标签选取：难题多给几个示例，简单题少给，省 token</text>
</svg>
