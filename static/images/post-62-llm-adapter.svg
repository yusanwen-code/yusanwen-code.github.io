<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="1" y="1" width="878" height="538" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="44" y="50" font-size="20" font-weight="700" fill="#1e293b">多供应商接入：业务只认 provider + model</text>
  <text x="44" y="74" font-size="13" fill="#64748b">OpenAI 兼容协议打底，差异收进 capability flag</text>
  <defs>
    <marker id="arwC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
  </defs>

  <rect x="60" y="130" width="180" height="110" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="150" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">业务层</text>
  <text x="150" y="176" text-anchor="middle" font-size="12" fill="#1e293b">炼丹引擎 · 对话逻辑</text>
  <text x="150" y="196" text-anchor="middle" font-size="12" fill="#64748b">只认 provider + model</text>
  <text x="150" y="216" text-anchor="middle" font-size="11" fill="#64748b">完全不感知供应商</text>

  <line x1="240" y1="185" x2="270" y2="185" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arwC)"/>

  <rect x="276" y="130" width="250" height="150" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="401" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#0369a1">UnifiedLLMClient</text>
  <text x="401" y="178" text-anchor="middle" font-size="12" fill="#1e293b">Complete() · Stream() 统一接口</text>
  <text x="401" y="198" text-anchor="middle" font-size="12" fill="#1e293b">流式经 parse_sse_chunk 归一化</text>
  <text x="401" y="216" text-anchor="middle" font-size="12" fill="#64748b">对外只吐 {content, tool_calls, done}</text>
  <text x="401" y="240" text-anchor="middle" font-size="11" fill="#94a3b8">超时、重试按供应商单独配置</text>
  <text x="401" y="258" text-anchor="middle" font-size="11" fill="#94a3b8">api_key 解密后只在内存短暂存在</text>

  <line x1="526" y1="185" x2="552" y2="185" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arwC)"/>
  <line x1="558" y1="132" x2="558" y2="392" stroke="#cbd5e1" stroke-width="2"/>

  <rect x="574" y="110" width="256" height="44" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="590" y="128" font-size="12" font-weight="700" fill="#1e293b">DeepSeek · Kimi</text>
  <text x="590" y="146" font-size="11" fill="#64748b">兼容最彻底，几乎零适配</text>

  <rect x="574" y="158" width="256" height="44" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="590" y="176" font-size="12" font-weight="700" fill="#1e293b">通义（DashScope 兼容模式）</text>
  <text x="590" y="194" font-size="11" fill="#64748b">个别字段行为有差异</text>

  <rect x="574" y="206" width="256" height="44" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="590" y="224" font-size="12" font-weight="700" fill="#1e293b">智谱</text>
  <text x="590" y="242" font-size="11" fill="#64748b">早期 tool_calls 命名有出入</text>

  <rect x="574" y="254" width="256" height="44" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="590" y="272" font-size="12" font-weight="700" fill="#1e293b">文心</text>
  <text x="590" y="290" font-size="11" fill="#64748b">兼容上线较晚，曾需单独处理 access_token</text>

  <rect x="574" y="302" width="256" height="44" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="590" y="320" font-size="12" font-weight="700" fill="#1e293b">VLLM（自托管）</text>
  <text x="590" y="338" font-size="11" fill="#64748b">base_url、默认模型从部署配置读</text>

  <rect x="574" y="350" width="256" height="44" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="590" y="368" font-size="12" font-weight="700" fill="#1e293b">Ollama</text>
  <text x="590" y="386" font-size="11" fill="#64748b">/v1 与原生 /api/chat 字段不同</text>

  <rect x="60" y="420" width="380" height="84" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="84" y="446" font-size="13" font-weight="700" fill="#b45309">差异收进 capability flag</text>
  <text x="84" y="466" font-size="12" fill="#1e293b">supports_tools · stream_chunk_path · auth_style</text>
  <text x="84" y="486" font-size="12" fill="#64748b">主流程保持统一，新增供应商通常只加配置</text>

  <rect x="460" y="420" width="380" height="84" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="484" y="446" font-size="13" font-weight="700" fill="#6d28d9">超时重试按供应商配</text>
  <text x="484" y="466" font-size="12" fill="#1e293b">只对 5xx 和连接错误重试</text>
  <text x="484" y="486" font-size="12" fill="#64748b">429/400 不盲目重试；Key 加密存储，永不下发前端</text>

  <text x="44" y="524" font-size="12" fill="#94a3b8">加一个新供应商主要是配置工作，炼丹和对话逻辑一行不用改</text>
</svg>
