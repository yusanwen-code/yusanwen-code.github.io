<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="1" y="1" width="878" height="458" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="44" y="50" font-size="20" font-weight="700" fill="#1e293b">提示词的长度，应该随模型变强而变短</text>
  <text x="44" y="74" font-size="13" fill="#64748b">掼蛋牌桌实证：100-200 字的赢家，700 字的战术大全没赢</text>

  <defs>
    <marker id="arwB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
  </defs>

  <rect x="60" y="96" width="340" height="230" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="84" y="118" width="120" height="32" rx="8" fill="#64748b"/>
  <text x="144" y="139" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">去年的牌桌</text>

  <rect x="84" y="170" width="96" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="132" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">弱模型</text>
  <text x="132" y="238" text-anchor="middle" font-size="11" fill="#64748b">牌感要人教</text>

  <line x1="230" y1="200" x2="188" y2="200" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arwB)"/>

  <rect x="234" y="172" width="150" height="46" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="309" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca">700 字战术大全</text>
  <text x="309" y="209" text-anchor="middle" font-size="11" fill="#6366f1">去年是导航</text>

  <rect x="234" y="228" width="150" height="46" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="309" y="248" text-anchor="middle" font-size="12" fill="#475569">拆牌 · 记牌 · 配合</text>
  <text x="309" y="265" text-anchor="middle" font-size="11" fill="#64748b">写得越细越像样</text>

  <text x="84" y="308" font-size="12" fill="#64748b">弱模型吃导航这套：战术写得细，牌才打得像样</text>

  <defs>
    <marker id="arwR2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <line x1="414" y1="211" x2="466" y2="211" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arwB)"/>
  <text x="440" y="196" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">模型变强</text>

  <rect x="480" y="96" width="340" height="230" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <rect x="504" y="118" width="120" height="32" rx="8" fill="#059669"/>
  <text x="564" y="139" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">今年的牌桌</text>

  <rect x="504" y="170" width="96" height="110" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <text x="552" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">强模型</text>
  <text x="552" y="238" text-anchor="middle" font-size="11" fill="#059669">牌感已内化</text>

  <line x1="650" y1="192" x2="608" y2="192" stroke="#059669" stroke-width="2" marker-end="url(#arwB)"/>
  <rect x="654" y="170" width="150" height="44" rx="10" fill="#10b981"/>
  <text x="729" y="189" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">100-200 字</text>
  <text x="729" y="206" text-anchor="middle" font-size="11" fill="#d1fae5">目标 + 底线 ✅ 赢</text>

  <line x1="650" y1="252" x2="608" y2="252" stroke="#dc2626" stroke-width="2" marker-end="url(#arwR2)"/>
  <rect x="654" y="230" width="150" height="44" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="729" y="249" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">700 字硬规则</text>
  <text x="729" y="266" text-anchor="middle" font-size="11" fill="#b91c1c">互相打架 ✗ 没赢</text>

  <text x="504" y="308" font-size="12" fill="#64748b">同一张牌桌：短提示词给模型留了发挥空间，硬规则框死了判断力</text>

  <text x="44" y="396" font-size="12" fill="#94a3b8">提示词里最贵的成分不是技巧，是对模型的不信任</text>
  <text x="44" y="416" font-size="12" fill="#94a3b8">每次换更强的模型：把存量提示词重测一遍，逐条问「这条还需要吗」，先删后加</text>
</svg>
