<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="1" y="1" width="878" height="458" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="44" y="50" font-size="20" font-weight="700" fill="#1e293b">OpenAlex 增量同步：游标推进 + ID 去重</text>
  <text x="44" y="74" font-size="13" fill="#64748b">状态记在 sync_state，重复写入靠 openalex_id 冲突更新兜底</text>

  <defs>
    <marker id="arwC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
    <marker id="arwR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arwG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect x="44" y="110" width="130" height="90" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="109" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Temporal Worker</text>
  <text x="109" y="160" text-anchor="middle" font-size="11" fill="#64748b">触发同步任务</text>
  <text x="109" y="178" text-anchor="middle" font-size="11" fill="#64748b">单页失败自动重试</text>

  <line x1="174" y1="155" x2="200" y2="155" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="204" y="110" width="170" height="90" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="289" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#0369a1">读 sync_state</text>
  <text x="289" y="160" text-anchor="middle" font-size="11" fill="#1e293b">最后游标 cursor</text>
  <text x="289" y="178" text-anchor="middle" font-size="11" fill="#1e293b">最后同步日期</text>

  <line x1="374" y1="155" x2="400" y2="155" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="404" y="110" width="210" height="90" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="509" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">请求 OpenAlex</text>
  <text x="509" y="156" text-anchor="middle" font-size="11" fill="#1e293b">/works?from_publication_date</text>
  <text x="509" y="174" text-anchor="middle" font-size="11" fill="#1e293b">cursor 翻页 · per_page=200</text>
  <text x="509" y="192" text-anchor="middle" font-size="11" fill="#64748b">mailto 进 Polite Pool</text>

  <line x1="614" y1="155" x2="640" y2="155" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="644" y="110" width="192" height="90" rx="10" fill="#059669"/>
  <text x="740" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">MySQL Upsert</text>
  <text x="740" y="160" text-anchor="middle" font-size="11" fill="#d1fae5">openalex_id 当业务主键</text>
  <text x="740" y="178" text-anchor="middle" font-size="11" fill="#d1fae5">冲突 → 更新而非插入</text>

  <path d="M 740 200 L 740 238 L 289 238 L 289 206" fill="none" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>
  <text x="515" y="232" text-anchor="middle" font-size="11" fill="#94a3b8">next_cursor 非空：写回游标，继续下一页</text>

  <line x1="810" y1="200" x2="810" y2="264" stroke="#10b981" stroke-width="2" marker-end="url(#arwG)"/>

  <rect x="756" y="268" width="108" height="52" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="810" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">本轮结束</text>
  <text x="810" y="308" text-anchor="middle" font-size="11" fill="#1e293b">next_cursor 为空</text>

  <line x1="509" y1="200" x2="509" y2="300" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arwR)"/>
  <text x="520" y="256" font-size="11" fill="#dc2626">游标失效 / 报错</text>

  <rect x="60" y="304" width="380" height="76" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="84" y="330" font-size="13" font-weight="700" fill="#dc2626">回退方案：按日期重拉</text>
  <text x="84" y="352" font-size="11" fill="#1e293b">游标过期 → 改用 from_publication_date 重拉最近 7 天</text>
  <text x="84" y="370" font-size="11" fill="#64748b">重拉的数据同样走 Upsert，重复了也只是覆盖一遍</text>

  <text x="44" y="436" font-size="12" fill="#94a3b8">mailto 参数进 Polite Pool：不加约 10 请求/秒就撞 429，加了能跑到 20 以上</text>
</svg>
