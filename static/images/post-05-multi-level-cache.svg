<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="1" y="1" width="878" height="498" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="44" y="50" font-size="20" font-weight="700" fill="#1e293b">两级缓存：L1 进程内存 + L2 Redis</text>
  <text x="44" y="74" font-size="13" fill="#64748b">读逐层穿透、逐层回填；写先更库，再删缓存</text>

  <defs>
    <marker id="arwC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
    <marker id="arwG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
  </defs>

  <text x="60" y="112" font-size="13" font-weight="700" fill="#475569">读路径</text>

  <rect x="60" y="126" width="130" height="64" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="125" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">业务请求</text>
  <text x="125" y="172" text-anchor="middle" font-size="12" fill="#64748b">读多写少</text>

  <line x1="190" y1="158" x2="218" y2="158" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arwC)"/>

  <rect x="224" y="126" width="180" height="64" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="314" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">L1 go-cache</text>
  <text x="314" y="170" text-anchor="middle" font-size="12" fill="#475569">进程内存 · TTL 1 分钟</text>

  <line x1="404" y1="158" x2="432" y2="158" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arwC)"/>
  <text x="418" y="146" text-anchor="middle" font-size="11" fill="#94a3b8">未命中</text>

  <rect x="438" y="126" width="180" height="64" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="528" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">L2 Redis</text>
  <text x="528" y="170" text-anchor="middle" font-size="12" fill="#475569">实例共享 · TTL 30 分钟</text>

  <line x1="618" y1="158" x2="646" y2="158" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arwC)"/>
  <text x="632" y="146" text-anchor="middle" font-size="11" fill="#94a3b8">未命中</text>

  <rect x="652" y="126" width="168" height="64" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="736" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">MySQL</text>
  <text x="736" y="172" text-anchor="middle" font-size="12" fill="#64748b">兜底数据源</text>

  <polyline points="528,190 528,226 314,226 314,196" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arwG)"/>
  <text x="421" y="244" text-anchor="middle" font-size="12" fill="#047857">Redis 命中，回填本地（TTL 1 分钟）</text>

  <polyline points="736,190 736,272 560,272 560,196" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arwG)"/>
  <text x="648" y="290" text-anchor="middle" font-size="12" fill="#047857">查库结果回填 Redis + 本地</text>

  <text x="60" y="330" font-size="13" font-weight="700" fill="#475569">写路径（cache-aside）</text>

  <rect x="60" y="344" width="190" height="60" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="155" y="368" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">更新数据库</text>
  <text x="155" y="388" text-anchor="middle" font-size="12" fill="#64748b">唯一可信源</text>

  <line x1="250" y1="374" x2="286" y2="374" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arwC)"/>

  <rect x="292" y="344" width="180" height="60" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="382" y="368" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">删除 Redis</text>
  <text x="382" y="388" text-anchor="middle" font-size="12" fill="#64748b">不主动更新缓存</text>

  <line x1="472" y1="374" x2="508" y2="374" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arwC)"/>

  <rect x="514" y="344" width="180" height="60" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="604" y="368" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">删除本地缓存</text>
  <text x="604" y="388" text-anchor="middle" font-size="12" fill="#64748b">只对本实例生效</text>

  <text x="716" y="368" font-size="12" fill="#64748b">先更库再删缓存，</text>
  <text x="716" y="388" font-size="12" fill="#64748b">并发写不进脏数据</text>

  <rect x="60" y="424" width="760" height="52" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="84" y="446" font-size="13" font-weight="700" fill="#b45309">多实例的脏数据窗口</text>
  <text x="254" y="446" font-size="12" fill="#64748b">A 实例更新后，B 实例的本地缓存收不到失效通知，只能等 TTL 过期（最长 1 分钟）</text>
  <text x="84" y="466" font-size="12" fill="#64748b">强一致数据（余额、库存）不进 L1：直查 Redis 或数据库，必要时加分布式锁</text>

  <text x="44" y="494" font-size="12" fill="#94a3b8">本地 TTL 差异：本地远短于 Redis，用脏数据窗口换访问延迟 · 缓存按一致性分级</text>
</svg>
