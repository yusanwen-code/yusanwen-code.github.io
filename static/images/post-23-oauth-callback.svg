<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="1" y="1" width="878" height="498" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="44" y="50" font-size="20" font-weight="700" fill="#1e293b">三端 OAuth，收敛到一个 Callback</text>
  <text x="44" y="74" font-size="13" fill="#64748b">统一 IdentityProvider 接口 · user_identities 绑定表 · state 一次性消费</text>

  <defs>
    <marker id="arwC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
    <marker id="arwG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect x="44" y="100" width="170" height="88" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="129" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">微信</text>
  <text x="129" y="148" text-anchor="middle" font-size="11" fill="#1e293b">网页授权 code 换 token</text>
  <text x="129" y="166" text-anchor="middle" font-size="11" fill="#1e293b">unionid 靠开放平台绑定</text>

  <rect x="234" y="100" width="170" height="88" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="319" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">企业微信</text>
  <text x="319" y="148" text-anchor="middle" font-size="11" fill="#1e293b">corpid + agentid</text>
  <text x="319" y="166" text-anchor="middle" font-size="11" fill="#1e293b">userid 企业内唯一</text>

  <rect x="424" y="100" width="170" height="88" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="509" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">飞书</text>
  <text x="509" y="148" text-anchor="middle" font-size="11" fill="#1e293b">标准 OIDC 风格</text>
  <text x="509" y="166" text-anchor="middle" font-size="11" fill="#1e293b">独立 user_info 端点</text>

  <line x1="129" y1="188" x2="129" y2="210" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>
  <line x1="319" y1="188" x2="319" y2="210" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>
  <line x1="509" y1="188" x2="509" y2="210" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="44" y="214" width="792" height="64" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="440" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#0369a1">IdentityProvider 接口：AuthURL(state) 生成跳转 · Exchange(code) 换统一 Identity</text>
  <text x="440" y="260" text-anchor="middle" font-size="12" fill="#1e293b">Identity：Provider · OpenID · UnionID · 昵称 · 头像</text>

  <text x="44" y="302" font-size="13" font-weight="700" fill="#475569">Callback 统一入口</text>

  <rect x="44" y="314" width="150" height="56" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="119" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">code + state 回跳</text>
  <text x="119" y="356" text-anchor="middle" font-size="11" fill="#64748b">第三方跳回来</text>

  <line x1="198" y1="342" x2="218" y2="342" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="222" y="314" width="190" height="56" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="317" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">Redis 取 state 元数据</text>
  <text x="317" y="356" text-anchor="middle" font-size="11" fill="#1e293b">立即 Del · 5 分钟过期</text>

  <line x1="416" y1="342" x2="436" y2="342" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="440" y="314" width="170" height="56" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="525" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Exchange(code)</text>
  <text x="525" y="356" text-anchor="middle" font-size="11" fill="#64748b">得到统一 Identity</text>

  <line x1="614" y1="342" x2="634" y2="342" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="638" y="314" width="198" height="56" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="737" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">查 user_identities</text>
  <text x="737" y="356" text-anchor="middle" font-size="11" fill="#1e293b">provider + provider_uid</text>

  <line x1="700" y1="370" x2="494" y2="394" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>
  <line x1="737" y1="370" x2="700" y2="394" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="222" y="398" width="300" height="66" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="238" y="420" font-size="13" font-weight="700" fill="#0369a1">action = login</text>
  <text x="238" y="438" font-size="12" fill="#1e293b">有绑定 → 直接签发 JWT 回跳</text>
  <text x="238" y="454" font-size="12" fill="#1e293b">没绑定 → 自动注册并绑定再签发</text>

  <rect x="556" y="398" width="280" height="66" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="572" y="420" font-size="13" font-weight="700" fill="#059669">action = bind</text>
  <text x="572" y="438" font-size="12" fill="#1e293b">写 user_identities 绑定关系</text>
  <text x="572" y="454" font-size="12" fill="#1e293b">302 回跳 redirect_uri</text>

  <text x="44" y="486" font-size="12" fill="#94a3b8">空壳账号的对策：同一手机号已有账号，提示登录后绑定，不直接新建</text>
</svg>
