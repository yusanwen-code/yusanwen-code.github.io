<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="1" y="1" width="878" height="438" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="44" y="50" font-size="20" font-weight="700" fill="#1e293b">垃圾文档是怎么毒害 RAG 的</text>
  <text x="44" y="74" font-size="13" fill="#64748b">投毒不是拉低平均分——是专挑你最需要正确答案的那次查询起作用</text>

  <defs>
    <marker id="arwA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
    <marker id="arwR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="60" y="106" font-size="14" font-weight="700" fill="#dc2626">没有治理</text>
  <rect x="60" y="116" width="120" height="52" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="120" y="138" text-anchor="middle" font-size="13" fill="#1e293b">文档堆</text>
  <text x="120" y="156" text-anchor="middle" font-size="12" fill="#dc2626">混着垃圾</text>

  <line x1="180" y1="142" x2="226" y2="142" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arwA)"/>
  <text x="203" y="132" text-anchor="middle" font-size="11" fill="#94a3b8">全入库</text>

  <rect x="232" y="116" width="120" height="52" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="292" y="138" text-anchor="middle" font-size="13" fill="#1e293b">知识库</text>
  <text x="292" y="156" text-anchor="middle" font-size="12" fill="#64748b">没人管</text>

  <line x1="352" y1="142" x2="398" y2="142" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arwA)"/>
  <text x="375" y="132" text-anchor="middle" font-size="11" fill="#94a3b8">检索命中</text>

  <rect x="404" y="116" width="130" height="52" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="469" y="138" text-anchor="middle" font-size="13" fill="#1e293b">垃圾片段</text>
  <text x="469" y="156" text-anchor="middle" font-size="12" fill="#dc2626">过时 · 打架 · 扫描糊</text>

  <line x1="534" y1="142" x2="580" y2="142" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arwA)"/>

  <rect x="586" y="116" width="120" height="52" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="646" y="138" text-anchor="middle" font-size="13" fill="#1e293b">模型引用</text>
  <text x="646" y="156" text-anchor="middle" font-size="12" fill="#64748b">一本正经</text>

  <line x1="706" y1="142" x2="744" y2="142" stroke="#dc2626" stroke-width="2" marker-end="url(#arwR)"/>

  <rect x="750" y="116" width="102" height="52" rx="10" fill="#dc2626"/>
  <text x="801" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">看着专业</text>
  <text x="801" y="156" text-anchor="middle" font-size="12" fill="#fecaca">其实有毒</text>

  <text x="60" y="238" font-size="14" font-weight="700" fill="#059669">有治理</text>
  <rect x="60" y="248" width="120" height="52" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="120" y="270" text-anchor="middle" font-size="13" fill="#1e293b">文档堆</text>
  <text x="120" y="288" text-anchor="middle" font-size="12" fill="#dc2626">混着垃圾</text>

  <line x1="180" y1="274" x2="226" y2="274" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arwA)"/>

  <rect x="232" y="248" width="150" height="52" rx="10" fill="#10b981"/>
  <text x="307" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">治理闸门</text>
  <text x="307" y="288" text-anchor="middle" font-size="12" fill="#ecfdf5">门槛 · 下线 · 裁决</text>

  <line x1="307" y1="300" x2="307" y2="322" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="317" y="318" font-size="12" fill="#dc2626">垃圾 × 被拦下</text>

  <line x1="382" y1="274" x2="420" y2="274" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arwA)"/>

  <rect x="426" y="248" width="120" height="52" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="486" y="270" text-anchor="middle" font-size="13" fill="#1e293b">知识库</text>
  <text x="486" y="288" text-anchor="middle" font-size="12" fill="#059669">干净</text>

  <line x1="546" y1="274" x2="592" y2="274" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arwA)"/>
  <text x="569" y="264" text-anchor="middle" font-size="11" fill="#94a3b8">检索命中</text>

  <rect x="598" y="248" width="130" height="52" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="663" y="270" text-anchor="middle" font-size="13" fill="#1e293b">可靠片段</text>
  <text x="663" y="288" text-anchor="middle" font-size="12" fill="#059669">来源 · 时效都对</text>

  <line x1="728" y1="274" x2="756" y2="274" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arwA)"/>

  <rect x="762" y="248" width="90" height="52" rx="10" fill="#059669"/>
  <text x="807" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">可信回答</text>
  <text x="807" y="288" text-anchor="middle" font-size="11" fill="#d1fae5">✅</text>

  <text x="44" y="396" font-size="12" fill="#94a3b8">治理全是纪律活：入库有门槛 · 过期定期下线 · 口径打架必须裁决</text>
  <text x="44" y="416" font-size="12" fill="#94a3b8">宁可库里 100 份干净文档，不要 1000 份说不清的</text>
</svg>
