<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="1" y="1" width="878" height="518" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="44" y="50" font-size="20" font-weight="700" fill="#1e293b">从学术 PDF 到知识图谱：四步流水线</text>
  <text x="44" y="74" font-size="13" fill="#64748b">召回交给 LLM，噪声靠证据校验和对齐压下去</text>
  <defs>
    <marker id="arwC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
  </defs>
  <rect x="56" y="100" width="116" height="60" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="114" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">学术 PDF</text>
  <text x="114" y="142" text-anchor="middle" font-size="11" fill="#64748b">段落里的结构化知识</text>
  <line x1="172" y1="130" x2="198" y2="130" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>
  <rect x="204" y="100" width="140" height="60" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="274" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#0369a1">切片</text>
  <text x="274" y="140" text-anchor="middle" font-size="11" fill="#1e293b">按章节/段落边界切</text>
  <text x="274" y="154" text-anchor="middle" font-size="11" fill="#64748b">不按 token 硬切</text>
  <line x1="344" y1="130" x2="370" y2="130" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>
  <rect x="376" y="100" width="180" height="60" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="466" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">实体抽取 · LLM</text>
  <text x="466" y="140" text-anchor="middle" font-size="11" fill="#1e293b">类型限定 + snake_case id</text>
  <text x="466" y="154" text-anchor="middle" font-size="11" fill="#64748b">带别名，供后续对齐</text>
  <line x1="466" y1="160" x2="466" y2="190" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>
  <rect x="376" y="196" width="180" height="60" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="466" y="218" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">关系抽取 · LLM</text>
  <text x="466" y="236" text-anchor="middle" font-size="11" fill="#1e293b">三元组：主体/关系/客体</text>
  <text x="466" y="250" text-anchor="middle" font-size="11" fill="#64748b">只许引用已有实体 ID</text>
  <line x1="556" y1="226" x2="582" y2="226" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>
  <rect x="588" y="196" width="110" height="60" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="643" y="218" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">证据校验</text>
  <text x="643" y="236" text-anchor="middle" font-size="11" fill="#1e293b">Evidence 回原文查</text>
  <text x="643" y="250" text-anchor="middle" font-size="11" fill="#64748b">找不到就丢弃</text>
  <line x1="698" y1="226" x2="724" y2="226" stroke="#cbd5e1" stroke-width="1.9" marker-end="url(#arwC)"/>
  <rect x="730" y="196" width="120" height="60" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="790" y="218" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">实体对齐</text>
  <text x="790" y="236" text-anchor="middle" font-size="11" fill="#1e293b">Embedding 余弦</text>
  <text x="790" y="250" text-anchor="middle" font-size="11" fill="#64748b">≥0.92 合并</text>
  <line x1="790" y1="256" x2="790" y2="286" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>
  <rect x="730" y="292" width="120" height="52" rx="10" fill="#059669"/>
  <text x="790" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">落图</text>
  <text x="790" y="330" text-anchor="middle" font-size="11" fill="#d1fae5">NebulaGraph</text>
  <rect x="376" y="292" width="300" height="52" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="396" y="312" font-size="12" font-weight="700" fill="#475569">写入示意</text>
  <text x="396" y="330" font-size="11" fill="#64748b">INSERT VERTEX entity(name, type) → 实体写顶点</text>
  <text x="396" y="345" font-size="11" fill="#64748b">INSERT EDGE cites(evidence) → 关系写边</text>
  <line x1="676" y1="318" x2="724" y2="318" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arwC)"/>
  <rect x="56" y="380" width="244" height="92" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="76" y="404" font-size="13" font-weight="700" fill="#b91c1c">幻觉：让模型交出证据</text>
  <text x="76" y="426" font-size="11" fill="#1e293b">每个三元组必须带 Evidence 原文句</text>
  <text x="76" y="444" font-size="11" fill="#1e293b">后处理做包含检查，找不到就丢</text>
  <text x="76" y="462" font-size="11" fill="#1e293b">这一刀砍掉了大量噪声</text>
  <rect x="318" y="380" width="244" height="92" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="338" y="404" font-size="13" font-weight="700" fill="#0369a1">类型漂移与对齐</text>
  <text x="338" y="426" font-size="11" fill="#1e293b">「BERT」一会儿 method 一会儿 model</text>
  <text x="338" y="444" font-size="11" fill="#1e293b">规则上下文 + 高频词典固化类型</text>
  <text x="338" y="462" font-size="11" fill="#1e293b">同名实体按向量相似度合并</text>
  <rect x="580" y="380" width="244" height="92" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="600" y="404" font-size="13" font-weight="700" fill="#b45309">成本与代词</text>
  <text x="600" y="426" font-size="11" fill="#1e293b">两档模型：抽取用便宜的，消歧用强模型</text>
  <text x="600" y="444" font-size="11" fill="#1e293b">成本降到全强模型的三分之一</text>
  <text x="600" y="462" font-size="11" fill="#1e293b">共指只在段内做，跨段不碰</text>
  <text x="44" y="500" font-size="12" fill="#94a3b8">向量负责找相关段落，图谱负责沿关系扩展，两者互补</text>
</svg>
