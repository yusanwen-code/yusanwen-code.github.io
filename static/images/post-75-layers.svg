<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="1" y="1" width="878" height="398" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="44" y="50" font-size="20" font-weight="700" fill="#1e293b">LLM 落地的五层底座</text>
  <text x="44" y="74" font-size="13" fill="#64748b">知识 · 技能 · 执行体 · 数据 · 专属模型</text>

  <defs>
    <marker id="arw2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
  </defs>

  <rect x="60" y="90" width="600" height="48" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <rect x="60" y="90" width="120" height="48" rx="10" fill="#0ea5e9"/>
  <text x="120" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">知识库</text>
  <text x="200" y="120" font-size="13" fill="#1e293b">让模型「知道」你的私有数据（RAG 检索增强）</text>

  <rect x="60" y="146" width="600" height="48" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <rect x="60" y="146" width="120" height="48" rx="10" fill="#6366f1"/>
  <text x="120" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Skill</text>
  <text x="200" y="176" font-size="13" fill="#1e293b">让模型「会做」专业任务（金丹：封装专家方法论）</text>

  <rect x="60" y="202" width="600" height="48" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <rect x="60" y="202" width="120" height="48" rx="10" fill="#8b5cf6"/>
  <text x="120" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Agent</text>
  <text x="200" y="232" font-size="13" fill="#1e293b">让模型「去干」（道人：规划 · 调工具 · 多步执行）</text>

  <rect x="60" y="258" width="600" height="48" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <rect x="60" y="258" width="120" height="48" rx="10" fill="#f59e0b"/>
  <text x="120" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">数据集</text>
  <text x="200" y="288" font-size="13" fill="#1e293b">让模型「学到」（指令对 · 对话对 · 评测集）</text>

  <rect x="60" y="314" width="600" height="48" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <rect x="60" y="314" width="120" height="48" rx="10" fill="#10b981"/>
  <text x="120" y="344" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">微调模型</text>
  <text x="200" y="344" font-size="13" fill="#1e293b">让模型「变成」专属模型（LoRA 内化到参数）</text>

  <line x1="740" y1="96" x2="740" y2="352" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arw2)"/>
  <text x="740" y="84" text-anchor="middle" font-size="13" fill="#64748b">落地路径</text>

  <text x="44" y="392" font-size="12" fill="#94a3b8">先用知识库快速见效 → 积累数据 → 封装技能 → 数据攒够再微调</text>
</svg>