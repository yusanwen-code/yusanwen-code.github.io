<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="1" y="1" width="878" height="478" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="44" y="50" font-size="20" font-weight="700" fill="#1e293b">数据集管理服务：按访问模式拆存储</text>
  <text x="44" y="74" font-size="13" fill="#64748b">结构化元数据归关系库，半结构化解析结果归文档库</text>
  <defs>
    <marker id="arwC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
    <marker id="arwR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="350" y="100" width="180" height="60" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="440" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">数据集管理服务</text>
  <text x="440" y="148" text-anchor="middle" font-size="11" fill="#64748b">Hertz · 两类数据混不下</text>

  <line x1="440" y1="164" x2="180" y2="212" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>
  <line x1="440" y1="164" x2="440" y2="212" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>
  <line x1="440" y1="164" x2="700" y2="212" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="60" y="216" width="230" height="118" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="175" y="242" text-anchor="middle" font-size="13" font-weight="700" fill="#0369a1">GaussDB</text>
  <text x="175" y="262" text-anchor="middle" font-size="11" fill="#1e293b">数据集 · 版本 · 文件 · 任务</text>
  <text x="175" y="280" text-anchor="middle" font-size="11" fill="#1e293b">团队配额 · 计费流水</text>
  <text x="175" y="302" text-anchor="middle" font-size="11" fill="#64748b">强一致 · 事务 · 复杂 JOIN</text>
  <text x="175" y="320" text-anchor="middle" font-size="11" fill="#64748b">客户侧信创要求 · 兼容 PG</text>
  <rect x="320" y="216" width="240" height="118" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="440" y="242" text-anchor="middle" font-size="13" font-weight="700" fill="#059669">MongoDB</text>
  <text x="440" y="262" text-anchor="middle" font-size="11" fill="#1e293b">原始切片 · chunk 元数据</text>
  <text x="440" y="280" text-anchor="middle" font-size="11" fill="#1e293b">实体/三元组 · 解析进度</text>
  <text x="440" y="302" text-anchor="middle" font-size="11" fill="#64748b">schema 多变 · 写多读少</text>
  <text x="440" y="320" text-anchor="middle" font-size="11" fill="#64748b">一个源文档一个 Document</text>

  <rect x="600" y="216" width="220" height="118" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="710" y="242" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">专用向量库（Milvus 类）</text>
  <text x="710" y="262" text-anchor="middle" font-size="11" fill="#1e293b">向量本体只存这里</text>
  <text x="710" y="280" text-anchor="middle" font-size="11" fill="#1e293b">两个库都不放向量</text>
  <text x="710" y="302" text-anchor="middle" font-size="12" fill="#64748b">Mongo 只存 chunk → vec_id 映射</text>
  <text x="710" y="320" text-anchor="middle" font-size="11" fill="#64748b">查询和并发更新更顺</text>

  <line x1="560" y1="275" x2="596" y2="275" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>
  <text x="578" y="264" text-anchor="middle" font-size="10" fill="#94a3b8">vec_id</text>
  <rect x="60" y="356" width="390" height="76" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="84" y="382" font-size="13" font-weight="700" fill="#475569">跨库一致性：权威在 GaussDB</text>
  <text x="84" y="402" font-size="11" fill="#64748b">数据集版本以它为准，Mongo 解析进度是附属状态</text>
  <text x="84" y="422" font-size="11" fill="#64748b">Mongo 写失败 → Temporal Worker 重试，最终一致</text>

  <rect x="470" y="356" width="390" height="76" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="494" y="382" font-size="13" font-weight="700" fill="#b45309">两个别踩的坑</text>
  <text x="494" y="402" font-size="11" fill="#64748b">chunk 数组无限 append 会顶到 16MB 上限</text>
  <text x="494" y="422" font-size="11" fill="#64748b">把 chunk 拆独立集合 doc_chunks，按 doc_id 关联</text>

  <text x="44" y="458" font-size="12" fill="#94a3b8">选型不是比哪个更先进，是把数据按访问模式切开</text>
</svg>
