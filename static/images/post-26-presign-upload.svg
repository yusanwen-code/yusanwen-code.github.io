<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="1" y="1" width="878" height="538" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="44" y="50" font-size="20" font-weight="700" fill="#1e293b">S3 预签名直传：后端只签名，不走数据</text>
  <text x="44" y="74" font-size="13" fill="#64748b">客户端直传 MinIO，后端退到签名与校验</text>

  <defs>
    <marker id="arwC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
    <marker id="arwG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect x="90" y="96" width="140" height="44" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="160" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">客户端</text>
  <rect x="370" y="96" width="140" height="44" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="440" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#0369a1">后端服务</text>
  <rect x="650" y="96" width="140" height="44" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="720" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">MinIO</text>

  <line x1="160" y1="140" x2="160" y2="480" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="440" y1="140" x2="440" y2="480" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="720" y1="140" x2="720" y2="480" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="298" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">1 · POST /files/presign</text>
  <line x1="160" y1="176" x2="436" y2="176" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>
  <text x="298" y="194" text-anchor="middle" font-size="11" fill="#94a3b8">文件名 · 大小 · MIME · 内容 SHA256</text>

  <rect x="300" y="206" width="280" height="40" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="440" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1">2 · 生成 file_id + object key，签 15 分钟 PUT URL</text>
  <text x="440" y="240" text-anchor="middle" font-size="11" fill="#64748b">file_objects 插入 status=uploading</text>

  <text x="302" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">3 · 返回 upload_url + file_id</text>
  <line x1="440" y1="272" x2="164" y2="272" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <text x="438" y="306" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">4 · PUT 文件（直传）</text>
  <line x1="160" y1="316" x2="716" y2="316" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>
  <text x="438" y="334" text-anchor="middle" font-size="11" fill="#94a3b8">大文件分片 16MB · 并发 · 断点续传</text>

  <text x="298" y="354" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">5 · POST /files/{id}/complete</text>
  <line x1="160" y1="364" x2="436" y2="364" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <text x="578" y="402" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">6 · HeadObject 校验</text>
  <line x1="440" y1="412" x2="716" y2="412" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>
  <text x="578" y="430" text-anchor="middle" font-size="11" fill="#94a3b8">对象真实存在 · 大小匹配</text>

  <rect x="300" y="442" width="300" height="36" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="450" y="465" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">7 · status → uploaded，投递解析任务</text>

  <text x="44" y="512" font-size="12" fill="#94a3b8">预签名 URL 绑定方法与 headers，客户端必须原样使用，否则 SignatureDoesNotMatch · 有效期 15 分钟</text>
</svg>
