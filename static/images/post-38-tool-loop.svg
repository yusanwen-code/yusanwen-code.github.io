<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="1" y="1" width="878" height="538" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="44" y="50" font-size="20" font-weight="700" fill="#1e293b">Function Calling 执行循环：防御都做在循环里</text>
  <text x="44" y="74" font-size="13" fill="#64748b">校验失败不报给用户——错误回给模型，通常一两轮自我修正</text>

  <defs>
    <marker id="arwC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
    <marker id="arwG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
    <marker id="arwR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="304" y="104" width="150" height="56" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="379" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">用户请求</text>
  <text x="379" y="146" text-anchor="middle" font-size="11" fill="#64748b">带对话历史</text>

  <line x1="379" y1="160" x2="379" y2="192" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="304" y="196" width="150" height="64" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="379" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#0369a1">模型</text>
  <text x="379" y="240" text-anchor="middle" font-size="11" fill="#1e293b">带工具定义</text>
  <text x="379" y="256" text-anchor="middle" font-size="11" fill="#64748b">输出或 tool_calls</text>

  <line x1="454" y1="228" x2="490" y2="228" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="494" y="196" width="150" height="64" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="569" y="220" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">响应里有没有</text>
  <text x="569" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">tool_calls？</text>

  <line x1="644" y1="228" x2="660" y2="228" stroke="#10b981" stroke-width="2" marker-end="url(#arwG)"/>
  <text x="652" y="218" text-anchor="middle" font-size="11" fill="#059669">无</text>

  <rect x="664" y="196" width="130" height="64" rx="10" fill="#059669"/>
  <text x="729" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">最终回答</text>
  <text x="729" y="240" text-anchor="middle" font-size="11" fill="#d1fae5">返回给用户</text>

  <path d="M569,260 L569,282 L390,282 L390,326" fill="none" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>
  <text x="577" y="276" font-size="11" fill="#64748b">有</text>

  <rect x="304" y="300" width="470" height="110" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="320" y="320" font-size="12" fill="#64748b">循环体：逐个执行 tool_calls（maxIterations 默认 5）</text>

  <rect x="320" y="330" width="130" height="60" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="385" y="352" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">① 参数校验</text>
  <text x="385" y="372" text-anchor="middle" font-size="11" fill="#1e293b">JSON Schema</text>

  <line x1="450" y1="360" x2="466" y2="360" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="470" y="330" width="130" height="60" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="535" y="352" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">② 执行工具</text>
  <text x="535" y="372" text-anchor="middle" font-size="11" fill="#1e293b">带超时的 context</text>

  <line x1="600" y1="360" x2="616" y2="360" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="620" y="330" width="130" height="60" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="685" y="352" text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1">③ 结果回填</text>
  <text x="685" y="372" text-anchor="middle" font-size="11" fill="#1e293b">role=tool 追加历史</text>

  <path d="M774,355 L814,355 L814,186 L384,186 L384,192" fill="none" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>
  <text x="598" y="178" text-anchor="middle" font-size="11" fill="#94a3b8">带结果再问一轮，直到不再调用工具或达到 maxIterations</text>

  <line x1="540" y1="410" x2="540" y2="436" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arwR)"/>

  <rect x="470" y="440" width="240" height="64" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="590" y="464" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">校验失败 / 执行超时</text>
  <text x="590" y="484" text-anchor="middle" font-size="11" fill="#64748b">错误也作为 tool result 回给模型</text>

  <text x="44" y="524" font-size="12" fill="#94a3b8">防死循环：工具名+参数 hash 连续两次相同就中断 · 大结果裁剪后回填，防 token 爆掉</text>
</svg>
