<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="1" y="1" width="878" height="418" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="44" y="50" font-size="20" font-weight="700" fill="#1e293b">traceId 的透传链路</text>
  <text x="44" y="74" font-size="13" fill="#64748b">HTTP Header 与 gRPC metadata 一路接力，断点要手动补上</text>

  <defs>
    <marker id="arwC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
  </defs>

  <text x="60" y="122" font-size="11" fill="#94a3b8">HTTP 请求头：Uber-Trace-Id（后统一切 W3C traceparent）</text>

  <rect x="60" y="134" width="170" height="52" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="145" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">API 网关（Gin）</text>
  <text x="145" y="174" text-anchor="middle" font-size="11" fill="#64748b">TracingMiddleware</text>

  <line x1="230" y1="160" x2="260" y2="160" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>
  <rect x="264" y="134" width="150" height="52" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="339" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">clinic-rpc</text>
  <line x1="414" y1="160" x2="444" y2="160" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>
  <rect x="448" y="134" width="150" height="52" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="523" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">payment-rpc</text>
  <line x1="598" y1="160" x2="628" y2="160" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>
  <rect x="632" y="134" width="150" height="52" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="707" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">inventory-rpc</text>

  <text x="707" y="212" text-anchor="middle" font-size="11" fill="#dc2626">当年那次故障就出在这</text>
  <text x="44" y="214" font-size="12" fill="#64748b">每经过一次 gRPC 调用，SpanContext 就在 metadata 里接力一次</text>

  <rect x="60" y="246" width="252" height="100" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="76" y="272" font-size="13" font-weight="700" fill="#dc2626">断点① 自建 gRPC 连接</text>
  <text x="76" y="294" font-size="12" fill="#64748b">内置 trace 只覆盖自带的客户端</text>
  <text x="76" y="312" font-size="12" fill="#64748b">grpc.Dial 的连接要手动加拦截器</text>
  <text x="76" y="330" font-size="12" fill="#64748b">否则 Span 链到这里就断</text>

  <rect x="332" y="246" width="252" height="100" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="348" y="272" font-size="13" font-weight="700" fill="#dc2626">断点② 异步 goroutine</text>
  <text x="348" y="294" font-size="12" fill="#64748b">context.Background() 一用就断</text>
  <text x="348" y="312" font-size="12" fill="#64748b">规矩：从父 ctx 派生，但要 detach</text>
  <text x="348" y="330" font-size="12" fill="#64748b">detachContext：留 trace，断 cancel</text>

  <rect x="604" y="246" width="216" height="100" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="620" y="272" font-size="13" font-weight="700" fill="#b45309">采样与头的兼容</text>
  <text x="620" y="294" font-size="12" fill="#64748b">100% 采样压不住，改 10%</text>
  <text x="620" y="312" font-size="12" fill="#64748b">错误请求强制全采 priority=1</text>
  <text x="620" y="330" font-size="12" fill="#64748b">B3 头对不上 → 改 traceparent</text>

  <text x="44" y="384" font-size="12" fill="#94a3b8">透传不能有断点：HTTP 入口、gRPC 双向、异步 goroutine 都要覆盖，排查从小时级降到分钟级</text>
</svg>
