<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="1" y="1" width="878" height="468" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="44" y="50" font-size="20" font-weight="700" fill="#1e293b">那次 5 秒卡顿：span 瀑布图上的根因</text>
  <text x="44" y="74" font-size="13" fill="#64748b">DB、Redis、外部 AI 判读都包成子 span，瀑布图才反映真实耗时</text>

  <defs>
    <marker id="arwC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
    <marker id="arwG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
  </defs>

  <text x="240" y="100" text-anchor="middle" font-size="11" fill="#94a3b8">0</text>
  <text x="348" y="100" text-anchor="middle" font-size="11" fill="#94a3b8">1s</text>
  <text x="456" y="100" text-anchor="middle" font-size="11" fill="#94a3b8">2s</text>
  <text x="564" y="100" text-anchor="middle" font-size="11" fill="#94a3b8">3s</text>
  <text x="672" y="100" text-anchor="middle" font-size="11" fill="#94a3b8">4s</text>
  <text x="780" y="100" text-anchor="middle" font-size="11" fill="#94a3b8">5s</text>

  <line x1="240" y1="108" x2="240" y2="292" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="348" y1="108" x2="348" y2="292" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="456" y1="108" x2="456" y2="292" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="564" y1="108" x2="564" y2="292" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="672" y1="108" x2="672" y2="292" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="780" y1="108" x2="780" y2="292" stroke="#f1f5f9" stroke-width="1"/>

  <text x="60" y="133" font-size="11" fill="#475569">整条 trace</text>
  <rect x="240" y="116" width="560" height="26" rx="6" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="252" y="133" font-size="12" fill="#1e293b">病历保存整条链路 · 5s+</text>

  <text x="60" y="173" font-size="11" fill="#475569">db.patient.save</text>
  <rect x="240" y="156" width="44" height="26" rx="6" fill="#10b981"/>
  <text x="296" y="173" font-size="11" fill="#64748b">落库很快</text>

  <text x="60" y="213" font-size="11" font-weight="700" fill="#475569">AI 影像判读（子 span）</text>
  <rect x="288" y="196" width="512" height="26" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="300" y="213" font-size="12" font-weight="700" fill="#dc2626">冷启动加载模型 ≈4s+</text>

  <text x="60" y="253" font-size="11" fill="#475569">前端</text>
  <rect x="240" y="236" width="560" height="26" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="4 3"/>
  <text x="252" y="253" font-size="12" fill="#64748b">同步等待判读结果</text>

  <line x1="544" y1="262" x2="544" y2="298" stroke="#10b981" stroke-width="2" marker-end="url(#arwG)"/>

  <rect x="60" y="302" width="760" height="92" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="84" y="330" font-size="13" font-weight="700" fill="#059669">改后</text>
  <text x="84" y="354" font-size="12" fill="#047857">保存接口只做落库 + 入队就返回，AI 结果靠回调通知</text>
  <text x="84" y="376" font-size="12" fill="#047857">P99 从 5 秒以上降到几百毫秒</text>

  <text x="44" y="444" font-size="12" fill="#94a3b8">采样不是一刀切：登录、支付 100%（span attribute 标记），普通查询 10%</text>
</svg>
