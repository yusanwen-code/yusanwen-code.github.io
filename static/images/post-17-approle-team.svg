<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="1" y="1" width="878" height="498" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="44" y="50" font-size="20" font-weight="700" fill="#1e293b">AppRole + Team：两层权限模型</text>
  <text x="44" y="74" font-size="13" fill="#64748b">全局层管身份和团队边界，角色和权限点留给应用自己定义</text>

  <defs>
    <marker id="arwC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
  </defs>

  <rect x="44" y="104" width="150" height="86" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="119" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">用户 张三</text>
  <text x="119" y="156" text-anchor="middle" font-size="11" fill="#64748b">同时属于多个团队</text>
  <text x="119" y="174" text-anchor="middle" font-size="11" fill="#64748b">角色按应用分别绑定</text>

  <line x1="194" y1="147" x2="222" y2="147" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="226" y="104" width="210" height="86" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="331" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#0369a1">数据中台团队</text>
  <text x="331" y="156" text-anchor="middle" font-size="11" fill="#1e293b">隔离边界：数据/配置/成员</text>
  <text x="331" y="174" text-anchor="middle" font-size="11" fill="#64748b">跨团队访问必须显式授权</text>

  <line x1="436" y1="147" x2="464" y2="147" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="468" y="104" width="368" height="86" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="652" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">统一认证中心 · 全局层</text>
  <text x="652" y="156" text-anchor="middle" font-size="11" fill="#1e293b">只存绑定：team_id · user_id · app_id · app_role</text>
  <text x="652" y="174" text-anchor="middle" font-size="11" fill="#64748b">CheckPermission 只查绑定，不解释权限点含义</text>

  <text x="44" y="226" font-size="13" font-weight="700" fill="#475569">应用层：角色编码和权限点由应用自己定义，认证中心只认绑定</text>

  <line x1="600" y1="190" x2="169" y2="240" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>
  <line x1="652" y1="190" x2="455" y2="240" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>
  <line x1="704" y1="190" x2="726" y2="240" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="44" y="244" width="250" height="92" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="169" y="272" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">支付平台</text>
  <text x="169" y="294" text-anchor="middle" font-size="12" fill="#475569">运营 / 财务 / 商户管理员</text>
  <text x="169" y="316" text-anchor="middle" font-size="11" fill="#64748b">权限元数据接口向认证中心注册</text>

  <rect x="330" y="244" width="250" height="92" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="455" y="272" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">数据治理服务</text>
  <text x="455" y="294" text-anchor="middle" font-size="12" fill="#475569">角色：数据管理员 / 分析师</text>
  <text x="455" y="316" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">张三 → admin</text>

  <rect x="616" y="244" width="220" height="92" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="726" y="272" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">知识库问答</text>
  <text x="726" y="294" text-anchor="middle" font-size="12" fill="#475569">张三 → viewer</text>
  <text x="726" y="316" text-anchor="middle" font-size="11" fill="#64748b">同一个团队，换个应用就换角色</text>

  <rect x="44" y="366" width="396" height="84" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="68" y="392" font-size="13" font-weight="700" fill="#b45309">Token 只带当前团队</text>
  <text x="68" y="414" font-size="11" fill="#1e293b">JWT：当前 team_id + 各应用的 role 映射，本地做粗鉴权</text>
  <text x="68" y="432" font-size="11" fill="#64748b">细粒度回查认证中心或缓存；切团队走 switch-team 重新签发</text>

  <rect x="468" y="366" width="368" height="84" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="492" y="392" font-size="13" font-weight="700" fill="#1e293b">隔离下沉到 DAO 层强制</text>
  <text x="492" y="414" font-size="11" fill="#1e293b">Gorm Scopes 封装 WithTeam</text>
  <text x="492" y="432" font-size="11" fill="#64748b">所有查询强制带 team_id，不怕哪次手写漏掉</text>

  <text x="44" y="478" font-size="12" fill="#94a3b8">新应用接入只需注册角色与权限元数据，认证中心的表结构不用动</text>
</svg>
