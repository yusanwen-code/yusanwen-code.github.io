<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="1" y="1" width="878" height="498" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="44" y="50" font-size="20" font-weight="700" fill="#1e293b">RAG 评测：一次跑批，出两组指标</text>
  <text x="44" y="74" font-size="13" fill="#64748b">检索和生成拆开评——坏了才知道是没召回，还是没用对</text>
  <defs>
    <marker id="arwC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
    <marker id="arwG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
  </defs>
  <rect x="60" y="110" width="190" height="110" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="155" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">标注集 300 → 500 条</text>
  <text x="155" y="156" text-anchor="middle" font-size="11" fill="#1e293b">高频问法 · 长尾术语</text>
  <text x="155" y="174" text-anchor="middle" font-size="11" fill="#1e293b">跨文档问题，三类都覆盖</text>
  <text x="155" y="194" text-anchor="middle" font-size="11" fill="#64748b">从真实 query 抽取</text>
  <text x="155" y="212" text-anchor="middle" font-size="11" fill="#64748b">领域同事标 gold chunk</text>

  <line x1="250" y1="165" x2="286" y2="165" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="290" y="110" width="210" height="110" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="395" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#0369a1">跑一遍 RAG 链路</text>
  <text x="395" y="156" text-anchor="middle" font-size="11" fill="#1e293b">整个链路当黑盒</text>
  <text x="395" y="174" text-anchor="middle" font-size="11" fill="#1e293b">内部埋点记下召回的 chunk IDs</text>
  <text x="395" y="194" text-anchor="middle" font-size="11" fill="#64748b">答案 + 召回一次产出</text>

  <line x1="500" y1="150" x2="552" y2="131" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>
  <line x1="500" y1="180" x2="552" y2="246" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>
  <rect x="560" y="88" width="280" height="86" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="700" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#0369a1">检索段：和 gold chunk 对答案</text>
  <text x="700" y="134" text-anchor="middle" font-size="11" fill="#1e293b">Recall@5：前 5 个里命中几个</text>
  <text x="700" y="152" text-anchor="middle" font-size="11" fill="#1e293b">MRR：第一个命中的位置</text>
  <text x="700" y="170" text-anchor="middle" font-size="11" fill="#64748b">没召回还是排序差，在这看</text>

  <rect x="560" y="194" width="280" height="104" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="700" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">生成段：LLM 当裁判</text>
  <text x="700" y="240" text-anchor="middle" font-size="11" fill="#1e293b">温度 0，分数档位写进 Prompt</text>
  <text x="700" y="258" text-anchor="middle" font-size="11" fill="#1e293b">chunk 随机打乱，防位置偏见</text>
  <text x="700" y="278" text-anchor="middle" font-size="11" fill="#1e293b">忠实度 · 相关度 · 完整度</text>
  <text x="700" y="292" text-anchor="middle" font-size="11" fill="#64748b">裁判不稳就接受，只做相对比较</text>
  <line x1="566" y1="178" x2="470" y2="352" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>
  <line x1="630" y1="302" x2="600" y2="352" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="60" y="250" width="190" height="90" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="155" y="276" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">标注集会老化</text>
  <text x="155" y="296" text-anchor="middle" font-size="11" fill="#1e293b">文档更新后 gold 会失效</text>
  <text x="155" y="316" text-anchor="middle" font-size="11" fill="#64748b">季度 review + 补 bad case</text>
  <line x1="155" y1="250" x2="155" y2="226" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="250" y="356" width="420" height="84" rx="10" fill="#059669" stroke="#059669" stroke-width="1"/>
  <text x="460" y="384" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">CI 回归卡口</text>
  <text x="460" y="404" text-anchor="middle" font-size="11" fill="#d1fae5">改 Prompt / 换 embedding / 调切片，自动跑 300 条</text>
  <text x="460" y="424" text-anchor="middle" font-size="11" fill="#d1fae5">Recall 或 Faithfulness 掉超 2 个百分点 → 拒绝合并</text>

  <text x="44" y="478" font-size="12" fill="#94a3b8">评测是做相对比较的，不给绝对值盖章</text>
</svg>
