<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 530" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="1" y="1" width="878" height="529" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="44" y="50" font-size="20" font-weight="700" fill="#1e293b">上下文组装：先扣硬支出，剩下的给历史</text>
  <text x="44" y="74" font-size="13" fill="#64748b">系统提示和 RAG 参考资料优先级最高；历史从最新往回填，装不下的压成摘要</text>

  <defs>
    <marker id="arwC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
    <marker id="arwG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect x="44" y="110" width="140" height="68" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="114" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">系统提示</text>
  <text x="114" y="160" text-anchor="middle" font-size="11" fill="#1e293b">优先级最高 · 先扣减</text>

  <rect x="192" y="110" width="130" height="68" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="257" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">历史摘要</text>
  <text x="257" y="160" text-anchor="middle" font-size="11" fill="#1e293b">被裁旧对话的压缩</text>

  <rect x="330" y="110" width="170" height="68" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="415" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#0369a1">参考资料</text>
  <text x="415" y="160" text-anchor="middle" font-size="11" fill="#1e293b">topK=5 · 每块≤500字</text>

  <rect x="508" y="110" width="150" height="68" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="583" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#059669">最近 10 轮历史</text>
  <text x="583" y="160" text-anchor="middle" font-size="11" fill="#1e293b">窗口内的历史</text>

  <rect x="666" y="110" width="170" height="68" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="751" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">当前 query</text>
  <text x="751" y="160" text-anchor="middle" font-size="11" fill="#64748b">最后一条 user 消息</text>

  <text x="44" y="205" font-size="11" fill="#94a3b8">组装顺序：摘要和参考资料都做成 system 消息，排在系统提示之后</text>

  <rect x="44" y="300" width="170" height="80" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="129" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">全量历史消息</text>
  <text x="129" y="352" text-anchor="middle" font-size="11" fill="#1e293b">含被裁掉的早期对话</text>
  <text x="129" y="370" text-anchor="middle" font-size="11" fill="#64748b">每条先估算 Token</text>

  <line x1="214" y1="340" x2="250" y2="340" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="254" y="300" width="210" height="80" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="359" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#0369a1">Token 预算裁剪</text>
  <text x="359" y="352" text-anchor="middle" font-size="11" fill="#1e293b">从最新往前累加，超预算即停</text>
  <text x="359" y="370" text-anchor="middle" font-size="11" fill="#64748b">粗估 + 发送前精确校验兜底</text>

  <line x1="464" y1="340" x2="500" y2="340" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="504" y="300" width="150" height="80" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="579" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#059669">窗口内消息</text>
  <text x="579" y="352" text-anchor="middle" font-size="11" fill="#1e293b">保留进消息数组</text>
  <text x="579" y="370" text-anchor="middle" font-size="11" fill="#64748b">最近的完整轮次</text>

  <line x1="654" y1="340" x2="690" y2="340" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="694" y="300" width="142" height="80" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="765" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">装不下的旧消息</text>
  <text x="765" y="352" text-anchor="middle" font-size="11" fill="#1e293b">超出预算被裁掉</text>
  <text x="765" y="370" text-anchor="middle" font-size="11" fill="#64748b">不直接丢弃</text>

  <line x1="765" y1="380" x2="765" y2="406" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="694" y="410" width="142" height="60" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="765" y="432" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">异步小模型摘要</text>
  <text x="765" y="452" text-anchor="middle" font-size="11" fill="#1e293b">≤200 字 · 保留主线</text>

  <text x="836" y="492" text-anchor="end" font-size="11" fill="#94a3b8">摘要随后作为一条 system 消息注入</text>

  <line x1="579" y1="300" x2="579" y2="184" stroke="#10b981" stroke-width="2" marker-end="url(#arwG)"/>
  <text x="587" y="250" font-size="11" fill="#94a3b8">回填到消息数组</text>

  <text x="44" y="508" font-size="12" fill="#94a3b8">RAG 参考资料会挤占历史预算：topK 从 8 降到 5、每块不超过 500 字，给历史留空间</text>
</svg>






