<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="1" y="1" width="878" height="478" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="44" y="50" font-size="20" font-weight="700" fill="#1e293b">Snowflake：出一个 ID 之前，先过这几关</text>
  <text x="44" y="74" font-size="13" fill="#64748b">WorkerID 启动时占用校验 · 回拨小则等、大则拒 · 同毫秒序列号自增</text>

  <defs>
    <marker id="arwC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
    <marker id="arwG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect x="44" y="100" width="236" height="88" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="60" y="126" font-size="13" font-weight="700" fill="#0369a1">WorkerID 从哪来</text>
  <text x="60" y="146" font-size="12" fill="#1e293b">StatefulSet 下标派生</text>
  <text x="60" y="164" font-size="12" fill="#1e293b">0-1023 · 配置中心预留范围</text>
  <text x="60" y="180" font-size="11" fill="#64748b">不写死在配置文件里</text>

  <line x1="280" y1="144" x2="318" y2="144" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arwC)"/>

  <rect x="322" y="100" width="236" height="88" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="338" y="126" font-size="13" font-weight="700" fill="#1e293b">启动时占用校验</text>
  <text x="338" y="146" font-size="12" fill="#1e293b">WorkerID + Pod IP + 启动时间</text>
  <text x="338" y="164" font-size="12" fill="#1e293b">写入 Redis 查一遍</text>
  <text x="338" y="180" font-size="11" fill="#64748b">旧实例还占着就换一个</text>

  <text x="44" y="222" font-size="13" font-weight="700" fill="#475569">NextID 每次调用</text>

  <rect x="44" y="236" width="140" height="60" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="114" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">取当前毫秒 now</text>
  <text x="114" y="280" text-anchor="middle" font-size="10" fill="#64748b">time.Now().UnixMilli()</text>

  <line x1="188" y1="266" x2="212" y2="266" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="216" y="236" width="180" height="60" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="306" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">now &lt; lastStamp？</text>
  <text x="306" y="278" text-anchor="middle" font-size="11" fill="#64748b">时钟回拨了吗</text>

  <line x1="396" y1="266" x2="428" y2="266" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>
  <text x="412" y="256" text-anchor="middle" font-size="11" fill="#94a3b8">没回拨</text>

  <line x1="306" y1="296" x2="306" y2="330" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>
  <text x="318" y="316" font-size="11" fill="#94a3b8">回拨了</text>

  <rect x="434" y="236" width="200" height="60" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="534" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1">同一毫秒：seq+1 &amp; 4095</text>
  <text x="534" y="278" text-anchor="middle" font-size="11" fill="#1e293b">序列号耗尽 → 等下一毫秒</text>

  <line x1="638" y1="266" x2="656" y2="266" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arwC)"/>

  <rect x="662" y="228" width="174" height="88" rx="10" fill="#059669"/>
  <text x="749" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">拼出 64 位 ID</text>
  <text x="749" y="280" text-anchor="middle" font-size="11" fill="#d1fae5">41 位时间戳</text>
  <text x="749" y="296" text-anchor="middle" font-size="11" fill="#d1fae5">10 位 WorkerID</text>
  <text x="749" y="312" text-anchor="middle" font-size="11" fill="#d1fae5">12 位序列号</text>

  <rect x="216" y="336" width="180" height="76" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="306" y="360" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">回拨 ≤ 5ms：自旋等待</text>
  <text x="306" y="380" text-anchor="middle" font-size="11" fill="#166534">sleep 追平 lastStamp</text>
  <text x="306" y="398" text-anchor="middle" font-size="11" fill="#166534">仍在回拨 → 报错</text>

  <rect x="434" y="336" width="200" height="76" rx="10" fill="#dc2626"/>
  <text x="534" y="360" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">回拨 &gt; 5ms：拒绝生成</text>
  <text x="534" y="380" text-anchor="middle" font-size="11" fill="#fecaca">返回 error，触发告警</text>
  <text x="534" y="398" text-anchor="middle" font-size="11" fill="#fecaca">上游降级，重试其他实例</text>

  <text x="44" y="452" font-size="12" fill="#94a3b8">WorkerID 按服务前缀切号段，别把多个服务混进同一段（压测撞过）· 41 位时间戳约 69 年，epoch 定在 2024-01-01</text>
</svg>
