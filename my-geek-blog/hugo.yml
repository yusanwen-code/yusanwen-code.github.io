baseURL: 'https://yusanwen-code.github.io'
languageCode: 'zh-CN'
title: 'Geek Blog'
theme: 'PaperMod'

# 分页设置
paginate: 10

# 启用 RSS
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

# 输出格式
outputs:
  home:
    - HTML
    - RSS
    - JSON

# 菜单配置
menu:
  main:
    - identifier: home
      name: 首页
      url: /
      weight: 10
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 20
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 30
    - identifier: about
      name: 关于
      url: /about/
      weight: 40

# PaperMod 主题参数
params:
  env: production
  title: Geek Blog
  description: '一个极简极客风格的静态博客'
  author: Geek
  # 默认主题: auto / light / dark
  defaultTheme: auto
  # 禁用主题切换
  disableThemeToggle: false
  # 启用搜索
  ShowShareButtons: false
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  # 首页设置
  homeInfoParams:
    Title: 'Hi, Geek Here 👋'
    Content: >
      欢迎来到我的极客博客。
      
      这里记录技术、思考与创造。

  # 社交链接
  socialIcons:
    - name: github
      url: 'https://github.com/yusanwen-code'
    - name: email
      url: 'mailto:yusanwen-code@users.noreply.github.com'
    - name: rss
      url: 'index.xml'

  # 编辑链接（可选）
  editPost:
    URL: 'https://github.com/yusanwen-code/yusanwen-code.github.io/tree/main/content'
    Text: '编辑此文'
    appendFilePath: true

  # 模糊搜索
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

# 标记语言设置
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: github-dark
    lineNos: true
    codeFences: true
    guessSyntax: true
    noClasses: false
